  <rect class="pulse" x="38" y="38" width="84" height="84" rx="24" fill="#0B2B24"/>
  <path class="pulse" d="M55 101L72 66C75.5 59 84.5 59 88 66L105 101" stroke="url(#g1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M67 92H93" stroke="#E9FFF5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="80" cy="55" r="5" fill="#00B7C7"/>
  <defs>

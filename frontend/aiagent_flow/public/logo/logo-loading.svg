<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ring { transform-origin: 80px 80px; animation: spin 1.4s linear infinite; }
    .pulse { transform-origin: 80px 80px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity:.78; } 50% { transform: scale(1.04); opacity:1; } }
  </style>

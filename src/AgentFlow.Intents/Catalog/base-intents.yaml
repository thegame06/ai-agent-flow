      - "Urgente por favor"
      - "Necesito ayuda inmediata"
      - "Esto es crítico"
      - "Emergency"
      - "Urgent please"
      - "I need immediate help"
    synonyms:
      - "emergencia"
      - "emergency"
      - "urgente"
      - "urgent"
      - "crítico"
    confidence_threshold: 0.94
    priority: 1000
    suggested_workflow: "support.emergency_escalation"
    metadata:
      requires_agent: true
      urgency: critical
      escalate_immediately: true
      sla_minutes: 2
      supervisor_required: true
      alert_ops: true

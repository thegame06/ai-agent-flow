      - "What documents do I need"
      - "Is there a fee"
      - "Is it secure"
    synonyms:
      - "pregunta"
      - "question"
      - "información"
      - "FAQ"
    confidence_threshold: 0.80
    priority: 100
    suggested_workflow: "information.faq_lookup"
    metadata:
      requires_agent: false
      auto_respond: true
      kb_search: true
  
  # --------------------------------------------------------------------------
  # SPECIAL / EDGE CASES
  # --------------------------------------------------------------------------
  
  - key: out_of_scope
    name: "Fuera de Alcance"
    description: "Mensaje no relacionado con los servicios (spam, off-topic)"
    category: general
    examples:
      - "Cuál es la capital de Francia"
      - "Cuéntame un chiste"
      - "asdfghjkl"
      - "12345"
      - "Tell me a joke"
      - "Random nonsense"
    synonyms:
      - "spam"
      - "off-topic"
      - "irrelevant"
    confidence_threshold: 0.70
    priority: 10
    suggested_workflow: null
    metadata:
      requires_agent: false
      auto_respond: true
      response_template: "out_of_scope"
      mark_as_spam: true
  
  - key: emergency
    name: "Emergencia"
    description: "Cliente reporta una emergencia o situación urgente crítica"
    category: support
    examples:

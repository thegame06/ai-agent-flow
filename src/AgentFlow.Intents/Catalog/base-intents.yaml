    synonyms:
      - "queja"
      - "reclamo"
      - "complaint"
      - "insatisfacción"
    confidence_threshold: 0.93
    priority: 600
    suggested_workflow: "complaints.formal_complaint"
    metadata:
      requires_agent: true
      urgency: critical
      escalate_immediately: true
      sla_minutes: 5
      supervisor_required: true
  
  - key: service_feedback
    name: "Retroalimentación de Servicio"
    description: "Cliente proporciona feedback sobre el servicio recibido"
    category: complaints
    examples:
      - "El servicio fue excelente"
      - "Tuve una mala experiencia"
      - "Quiero dar mi opinión"
      - "El agente fue muy amable"
      - "The service was excellent"
      - "I had a bad experience"
      - "I want to provide feedback"
    synonyms:
      - "feedback"
      - "retroalimentación"
      - "opinión"
      - "comentario"
    confidence_threshold: 0.85
    priority: 150
    suggested_workflow: "feedback.capture"
    metadata:
      requires_agent: false
      auto_respond: true
  
  # --------------------------------------------------------------------------

    metadata:
      requires_agent: true
      urgency: high
      sla_minutes: 15
  
  - key: cancel_appointment
    name: "Cancelar Cita"
    description: "Cliente desea cancelar una cita agendada"
    category: scheduling
    examples:
      - "Quiero cancelar mi cita"
      - "No podré asistir"
      - "Necesito cancelar la reunión"
      - "Ya no puedo ir"
      - "I want to cancel my appointment"
      - "I won't be able to attend"
      - "Need to cancel"
    synonyms:
      - "cancelar"
      - "cancel"
      - "anular cita"
    confidence_threshold: 0.90
    priority: 300
    suggested_workflow: "scheduling.cancel_appointment"
    metadata:
      requires_agent: true
      urgency: medium
  
  # --------------------------------------------------------------------------
  # COMPLAINTS
  # --------------------------------------------------------------------------
  
  - key: complaint
    name: "Queja o Reclamo"
    description: "Cliente presenta una queja formal o reclamo"
    category: complaints
    examples:
      - "Quiero presentar una queja"
      - "Estoy molesto con el servicio"
      - "Esto es inaceptable"
      - "Quiero hablar con un supervisor"
      - "I want to file a complaint"
      - "I'm not satisfied with the service"
